<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Logo Finance: mão segurando dinheiro em um círculo verde">
  <circle cx="50" cy="50" r="48" fill="#4f7a30"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#3f6226" stroke-width="1.5"/>

  <!-- cedulas em leque -->
  <g fill="#f4f4ef" stroke="#3f6226" stroke-width="1.2">
    <rect x="31" y="16" width="32" height="20" rx="3" transform="rotate(-20 47 26)"/>
    <rect x="33" y="14" width="32" height="20" rx="3" transform="rotate(-3 49 24)"/>
    <rect x="35" y="16" width="32" height="20" rx="3" transform="rotate(13 51 26)"/>
  </g>

  <!-- moeda com cifrao -->
  <circle cx="68" cy="20" r="10" fill="#e3b23c" stroke="#a8791f" stroke-width="1.2"/>
  <text x="68" y="24.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700" fill="#5c4110">$</text>

  <!-- mao: palma + dedos + polegar -->
  <g fill="#f4f4ef" stroke="#3f6226" stroke-width="1.3" stroke-linejoin="round">
    <rect x="22" y="63" width="34" height="28" rx="13"/>
    <rect x="24" y="47" width="7" height="24" rx="3.5"/>
    <rect x="32.5" y="42" width="7" height="29" rx="3.5"/>
    <rect x="41" y="41" width="7" height="30" rx="3.5"/>
    <rect x="49.5" y="45" width="7" height="26" rx="3.5"/>
    <rect x="46" y="56" width="8" height="20" rx="4" transform="rotate(48 50 66)"/>
  </g>

  <text x="50" y="93" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#f4f4ef">FINANCE</text>
</svg>
