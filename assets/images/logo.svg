<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Logo: pilha de moedas douradas com seta de alta, fundo roxo">
  <defs>
    <linearGradient id="coinTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#e89412"/>
    </linearGradient>
    <linearGradient id="coinSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e08b12"/>
      <stop offset="1" stop-color="#b5690a"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="22" fill="#2b1152"/>

  <!-- pilha de moedas (vista de lado, tipo fichas empilhadas) -->
  <g>
    <ellipse cx="34" cy="78" rx="19" ry="6" fill="url(#coinSide)"/>
    <rect x="15" y="66" width="38" height="12" fill="url(#coinSide)"/>
    <ellipse cx="34" cy="66" rx="19" ry="6" fill="url(#coinTop)"/>

    <ellipse cx="34" cy="68" rx="19" ry="6" fill="url(#coinSide)"/>
    <rect x="15" y="56" width="38" height="12" fill="url(#coinSide)"/>
    <ellipse cx="34" cy="56" rx="19" ry="6" fill="url(#coinTop)"/>

    <ellipse cx="34" cy="58" rx="19" ry="6" fill="url(#coinSide)"/>
    <rect x="15" y="46" width="38" height="12" fill="url(#coinSide)"/>
    <ellipse cx="34" cy="46" rx="19" ry="6" fill="url(#coinTop)"/>
  </g>

  <!-- seta de alta -->
  <path d="M26 62 L40 46 L48 54 L68 30 L76 30 L76 38 L68 38 L48 64 L40 56 L32 68 Z"
        fill="#f4f2fb" stroke="#c9c3e6" stroke-width="1"/>

  <!-- moeda de frente com cifrao -->
  <circle cx="64" cy="62" r="21" fill="url(#coinTop)" stroke="#b5690a" stroke-width="1.5"/>
  <circle cx="64" cy="62" r="16.5" fill="none" stroke="#b5690a" stroke-width="1.2" opacity="0.6"/>
  <text x="64" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fbf7ee">$</text>
</svg>
